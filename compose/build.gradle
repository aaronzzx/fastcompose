plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id "org.jetbrains.kotlin.kapt"
    id "org.jetbrains.kotlin.plugin.compose"
    id "maven-publish"
}

android {
    namespace "com.aaron.compose"

    compileSdk 35

    defaultConfig {
        minSdk 23
        targetSdk 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures {
        compose true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
                "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
                "-opt-in=androidx.compose.animation.ExperimentalAnimationApi",
                "-opt-in=androidx.compose.ui.ExperimentalComposeUiApi",
                "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
                "-opt-in=kotlin.RequiresOptIn",
                "-opt-in=kotlin.contracts.ExperimentalContracts",
                "-opt-in=androidx.paging.ExperimentalPagingApi"
        ]
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    publishing {
        singleVariant("release") {}
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:$compose_bom_version")
    api composeBom
    androidTestApi composeBom
    debugApi composeBom

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7'

    // Compose
    api "androidx.compose.ui:ui"
    api "androidx.compose.ui:ui-util"
    api "androidx.compose.ui:ui-tooling-preview"
    api "androidx.compose.ui:ui-viewbinding"
    api "androidx.compose.material:material-icons-extended"
    api "androidx.compose.material3:material3"
    api "androidx.compose.runtime:runtime-livedata"

    androidTestApi "androidx.compose.ui:ui-test-junit4"
    debugApi "androidx.compose.ui:ui-tooling"
    debugApi "androidx.compose.ui:ui-test-manifest"

    api "com.google.accompanist:accompanist-drawablepainter:$accompanist_version"
    api "com.google.accompanist:accompanist-permissions:$accompanist_version"

    api "androidx.paging:paging-compose:$paging_version"
    api "androidx.paging:paging-runtime:$paging_version"

    api "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    api "net.engawapg.lib:zoomable:1.6.1"

    api 'androidx.activity:activity-compose:1.9.3'
    api "androidx.navigation:navigation-compose:2.8.4"
    api 'androidx.hilt:hilt-navigation-compose:1.2.0'
    api "androidx.constraintlayout:constraintlayout-compose:1.1.0"

    api "io.coil-kt:coil-compose:2.7.0"

    // 不可变集合
//    api "org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.5"

    api "com.blankj:utilcodex:1.30.6"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.aaron.fastcompose'
                artifactId = 'compose'
                version = 'SNAPSHOT'
            }
        }
    }
}
